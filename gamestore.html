<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gamestore</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>GAME STORE</h1>

    <div class="searchGames">
        <input class="searchGameInput" type="text" placeholder="search game...">
        <button class = "searchButton"type="button">search</button>
    </div>
    <div class="favoriteGames">
        <button class="favoriteGamesButton" type="button">favorite games</button>
        <div class="favoriteGamesCont"></div>
    </div>
    


    <div class="allgames"></div>

    <button type="button" class="loadMoreButton" >load more games</button>

    <script type="module" src="main.js"></script>
</body>
</html>
